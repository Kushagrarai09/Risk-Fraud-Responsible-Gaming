name: CI
on: [push, pull_request]
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: riskdb, POSTGRES_USER: riskapp, POSTGRES_PASSWORD: riskapp}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U riskapp -d riskdb"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate
        env:
          DATABASE_URL: postgres://riskapp:riskapp@localhost:5432/riskdb
          DJANGO_SECRET_KEY: ci-test-secret
      - run: pytest backend
        env:
          DATABASE_URL: postgres://riskapp:riskapp@localhost:5432/riskdb
          DJANGO_SECRET_KEY: ci-test-secret
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install && npm run build
        working-directory: frontend
